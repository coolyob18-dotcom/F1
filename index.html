<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏎️ F1 LIVE TELEMETRY</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #15151E;
    color: #fff;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    min-height: 100vh;
    padding: 20px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 3px solid #E10600;
  }

  .header h1 { font-size: 28px; letter-spacing: 2px; font-weight: 900; }
  .header h1 span { color: #E10600; }

  .status {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #E10600;
    animation: pulse 1s infinite;
  }
  .dot.live { background: #00D2BE; }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  .grid { display: grid; gap: 15px; margin-bottom: 15px; }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  .grid-2 { grid-template-columns: 2fr 1fr; }

  .card {
    background: #1F1F27;
    border-radius: 10px;
    padding: 15px;
    border-left: 5px solid #E10600;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  }

  .card-title {
    color: #888; font-size: 11px; text-transform: uppercase;
    letter-spacing: 2px; margin-bottom: 8px; font-weight: 600;
  }

  .metric-value {
    font-size: 42px; font-weight: 900;
    font-family: 'Courier New', monospace; line-height: 1;
  }

  .metric-unit {
    font-size: 16px; color: #666; font-weight: normal; margin-left: 4px;
  }

  .gear-display {
    font-size: 96px; color: #E10600; font-weight: 900;
    text-align: center; font-family: 'Courier New', monospace;
    line-height: 1; text-shadow: 0 0 30px rgba(225, 6, 0, 0.5);
  }

  .drs-badge {
    text-align: center; padding: 8px; border-radius: 5px;
    font-weight: 900; letter-spacing: 3px; margin-top: 10px;
    background: #333; color: #666; transition: all 0.2s;
  }

  .drs-badge.active {
    background: #00D2BE; color: #15151E;
    box-shadow: 0 0 20px rgba(0, 210, 190, 0.6);
  }

  .bar-container {
    background: #0F0F15; height: 30px; border-radius: 5px;
    overflow: hidden; position: relative; margin-top: 8px;
  }

  .bar-fill {
    height: 100%; transition: width 0.1s linear;
    display: flex; align-items: center; justify-content: flex-end;
    padding-right: 8px; font-weight: bold; font-size: 14px; color: #15151E;
  }

  .bar-throttle { background: linear-gradient(90deg, #00D2BE, #00FFE0); }
  .bar-brake    { background: linear-gradient(90deg, #E10600, #FF4444); }
  .bar-ers      { background: linear-gradient(90deg, #FFD700, #FFE97A); }
  .bar-fuel     { background: linear-gradient(90deg, #00D2BE, #7BE0D3); }

  .tire-card {
    background: #1F1F27; border-radius: 10px; padding: 12px;
    text-align: center; border-top: 4px solid #E10600;
    transition: border-color 0.3s;
  }

  .tire-label { font-size: 12px; color: #888; letter-spacing: 2px; font-weight: bold; }

  .tire-temp {
    font-size: 28px; font-weight: 900;
    font-family: 'Courier New', monospace; margin: 5px 0;
  }

  .tire-wear-bar {
    background: #0F0F15; height: 6px; border-radius: 3px;
    overflow: hidden; margin-top: 6px;
  }

  .tire-wear-fill { height: 100%; background: #FFD700; transition: width 0.3s; }

  .chart-container {
    background: #1F1F27; border-radius: 10px; padding: 10px; height: 320px;
  }

  #trackMap {
    height: 380px; background: #1F1F27; border-radius: 10px; padding: 10px;
  }

  .lap-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 8px 0; border-bottom: 1px solid #2A2A33;
  }
  .lap-row:last-child { border-bottom: none; }
  .lap-label { color: #888; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
  .lap-value { font-family: 'Courier New', monospace; font-size: 22px; font-weight: bold; color: #00D2BE; }
  .lap-value.best { color: #A855F7; }

  .controls {
    position: fixed; bottom: 20px; right: 20px;
    display: flex; gap: 10px; z-index: 100;
  }

  .btn {
    background: #E10600; color: white; border: none;
    padding: 12px 20px; border-radius: 8px; font-weight: bold;
    letter-spacing: 1px; cursor: pointer; font-size: 14px;
    text-transform: uppercase; transition: all 0.2s;
    box-shadow: 0 4px 15px rgba(225, 6, 0, 0.4);
  }

  .btn:hover { background: #FF1717; transform: translateY(-2px); }
  .btn.paused { background: #FFD700; color: #15151E; }

  .steering-container {
    position: relative; height: 60px; background: #0F0F15;
    border-radius: 5px; margin-top: 10px; overflow: hidden;
  }

  .steering-center {
    position: absolute; left: 50%; top: 0; bottom: 0;
    width: 2px; background: #444; transform: translateX(-50%);
  }

  .steering-bar {
    position: absolute; top: 15px; height: 30px;
    background: #FFD700; border-radius: 3px;
    transition: all 0.1s linear;
    transform: translateX(-50%);
  }

  @media (max-width: 900px) {
    .grid-3, .grid-4, .grid-2 { grid-template-columns: 1fr; }
    .metric-value { font-size: 32px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>🏎️ F1 <span>LIVE TELEMETRY</span></h1>
  <div class="status">
    <div class="dot live"></div>
    <span id="statusText">LIVE</span>
  </div>
</div>

<div class="grid grid-3">
  <div class="card">
    <div class="card-title">SPEED</div>
    <div class="metric-value"><span id="speed">0</span><span class="metric-unit">km/h</span></div>
    <div class="bar-container">
      <div class="bar-fill bar-throttle" id="speedBar" style="width:0%"></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">RPM</div>
    <div class="metric-value"><span id="rpm">0</span><span class="metric-unit">rpm</span></div>
    <div class="bar-container">
      <div class="bar-fill bar-brake" id="rpmBar" style="width:0%"></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title" style="text-align:center;">GEAR</div>
    <div class="gear-display" id="gear">N</div>
    <div class="drs-badge" id="drsBadge">DRS</div>
  </div>
</div>

<div class="grid grid-3">
  <div class="card">
    <div class="card-title">THROTTLE</div>
    <div class="bar-container" style="height:40px;">
      <div class="bar-fill bar-throttle" id="throttleBar" style="width:0%">0%</div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">BRAKE</div>
    <div class="bar-container" style="height:40px;">
      <div class="bar-fill bar-brake" id="brakeBar" style="width:0%">0%</div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">STEERING</div>
    <div class="steering-container">
      <div class="steering-center"></div>
      <div class="steering-bar" id="steeringBar" style="left:50%; width:0px;"></div>
    </div>
    <div style="text-align:center;font-family:'Courier New';font-size:20px;margin-top:5px;" id="steeringValue">0°</div>
  </div>
</div>

<div class="grid grid-2">
  <div id="trackMap"></div>
  <div class="card">
    <div class="card-title">SESSION INFO</div>
    <div class="lap-row">
      <span class="lap-label">LAP</span>
      <span class="lap-value" id="lapCount">0</span>
    </div>
    <div class="lap-row">
      <span class="lap-label">CURRENT</span>
      <span class="lap-value" id="currentLap">0.000</span>
    </div>
    <div class="lap-row">
      <span class="lap-label">BEST</span>
      <span class="lap-value best" id="bestLap">--.---</span>
    </div>
    <div class="lap-row" style="flex-direction:column;align-items:stretch;">
      <span class="lap-label" style="margin-bottom:6px;">ERS</span>
      <div class="bar-container" style="height:14px;">
        <div class="bar-fill bar-ers" id="ersBar" style="width:100%"></div>
      </div>
    </div>
    <div class="lap-row" style="flex-direction:column;align-items:stretch;border-bottom:none;">
      <span class="lap-label" style="margin-bottom:6px;">FUEL</span>
      <div class="bar-container" style="height:14px;">
        <div class="bar-fill bar-fuel" id="fuelBar" style="width:100%"></div>
      </div>
    </div>
  </div>
</div>

<div class="grid grid-4" style="margin-bottom:15px;">
  <div class="tire-card" id="tireFL">
    <div class="tire-label">FL</div>
    <div class="tire-temp" id="tempFL">--°</div>
    <div class="tire-wear-bar"><div class="tire-wear-fill" id="wearFL" style="width:0%"></div></div>
  </div>
  <div class="tire-card" id="tireFR">
    <div class="tire-label">FR</div>
    <div class="tire-temp" id="tempFR">--°</div>
    <div class="tire-wear-bar"><div class="tire-wear-fill" id="wearFR" style="width:0%"></div></div>
  </div>
  <div class="tire-card" id="tireRL">
    <div class="tire-label">RL</div>
    <div class="tire-temp" id="tempRL">--°</div>
    <div class="tire-wear-bar"><div class="tire-wear-fill" id="wearRL" style="width:0%"></div></div>
  </div>
  <div class="tire-card" id="tireRR">
    <div class="tire-label">RR</div>
    <div class="tire-temp" id="tempRR">--°</div>
    <div class="tire-wear-bar"><div class="tire-wear-fill" id="wearRR" style="width:0%"></div></div>
  </div>
</div>

<div class="chart-container" id="historyChart"></div>

<div class="controls">
  <button class="btn" id="pauseBtn">⏸ PAUSE</button>
  <button class="btn" id="resetBtn" style="background:#00D2BE;color:#15151E;">↺ RESET</button>
</div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const CONFIG = {
  MAX_SPEED: 340,
  MAX_RPM: 15000,
  GEAR_RATIOS: [0, 3.5, 2.8, 2.2, 1.8, 1.5, 1.3, 1.1, 0.95],
  UPDATE_RATE: 20,
  HISTORY_SIZE: 300
};

/* ============================================================
   TRACK — плавная замкнутая трасса (Сузука-подобная)
   Генерируется по контрольным точкам через Catmull-Rom сплайн
   ============================================================ */
const TRACK_CONTROL_POINTS = [
  [0, 0],     [120, -20], [220, 20],  [280, 100],
  [300, 200], [260, 300], [180, 360], [80, 380],
  [-40, 360], [-120, 280], [-140, 180], [-100, 90],
  [-30, 30]
];

function catmullRom(p0, p1, p2, p3, t) {
  const t2 = t * t;
  const t3 = t2 * t;
  return [
    0.5 * ((2*p1[0]) + (-p0[0]+p2[0])*t + (2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2 + (-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
    0.5 * ((2*p1[1]) + (-p0[1]+p2[1])*t + (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2 + (-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)
  ];
}

function buildSmoothTrack(controlPoints, samplesPerSegment = 30) {
  const pts = [];
  const n = controlPoints.length;
  for (let i = 0; i < n; i++) {
    const p0 = controlPoints[(i - 1 + n) % n];
    const p1 = controlPoints[i];
    const p2 = controlPoints[(i + 1) % n];
    const p3 = controlPoints[(i + 2) % n];
    for (let s = 0; s < samplesPerSegment; s++) {
      const t = s / samplesPerSegment;
      pts.push(catmullRom(p0, p1, p2, p3, t));
    }
  }
  // Замыкаем
  pts.push([...pts[0]]);
  return pts;
}

const TRACK = buildSmoothTrack(TRACK_CONTROL_POINTS, 25);

// Длины сегментов и общая длина
const SEGMENT_LENGTHS = [];
let TRACK_LENGTH = 0;
for (let i = 0; i < TRACK.length - 1; i++) {
  const dx = TRACK[i+1][0] - TRACK[i][0];
  const dy = TRACK[i+1][1] - TRACK[i][1];
  const len = Math.hypot(dx, dy);
  SEGMENT_LENGTHS.push(len);
  TRACK_LENGTH += len;
}

// Получить позицию и угол по расстоянию s от старта
function getTrackPose(s) {
  s = ((s % TRACK_LENGTH) + TRACK_LENGTH) % TRACK_LENGTH;
  let acc = 0;
  for (let i = 0; i < SEGMENT_LENGTHS.length; i++) {
    if (acc + SEGMENT_LENGTHS[i] >= s) {
      const frac = (s - acc) / SEGMENT_LENGTHS[i];
      const p1 = TRACK[i];
      const p2 = TRACK[i + 1];
      const x = p1[0] + (p2[0] - p1[0]) * frac;
      const y = p1[1] + (p2[1] - p1[1]) * frac;
      const angle = Math.atan2(p2[1] - p1[1], p2[0] - p1[0]);
      return { x, y, angle, index: i };
    }
    acc += SEGMENT_LENGTHS[i];
  }
  const last = TRACK[TRACK.length - 1];
  return { x: last[0], y: last[1], angle: 0, index: 0 };
}

// Кривизна впереди (для симуляции водителя)
function getCurvatureAhead(s, lookahead) {
  const p1 = getTrackPose(s);
  const p2 = getTrackPose(s + lookahead);
  let dAngle = p2.angle - p1.angle;
  while (dAngle > Math.PI) dAngle -= 2 * Math.PI;
  while (dAngle < -Math.PI) dAngle += 2 * Math.PI;
  return dAngle;
}

/* ============================================================
   CAR SIMULATOR
   ============================================================ */
class CarSimulator {
  constructor() { this.reset(); }

  reset() {
    this.speed = 0;            // km/h
    this.rpm = 3000;
    this.gear = 0;
    this.throttle = 0;
    this.brake = 0;
    this.steering = 0;
    this.drs = false;
    this.ers = 100;
    this.fuel = 100;
    this.tireTemp = [80, 80, 80, 80];
    this.tireWear = [0, 0, 0, 0];
    this.lap = 0;
    this.lapTime = 0;
    this.bestLap = null;
    this.lapStart = performance.now() / 1000;
    this.distance = 0;         // пройденное расстояние по трассе (метры)
    this.position = [TRACK[0][0], TRACK[0][1], 0];
    this.lastS = 0;
  }

  update(dt) {
    this._driverInput();
    this._physics(dt);
    this._shiftGears();
    this._rpmCalc();
    this._ers(dt);
    this._fuel(dt);
    this._tires(dt);
    this._move(dt);
    this.lapTime = performance.now() / 1000 - this.lapStart;
  }

  /* Водитель смотрит на кривизну впереди и решает газ/тормоз */
  _driverInput() {
    const speedMs = this.speed / 3.6;
    // Смотрим вперёд пропорционально скорости (от 30 до 120 м)
    const lookahead = 30 + speedMs * 2.5;

    // Считаем кривизну в нескольких точках впереди и берём максимум
    let maxCurv = 0;
    for (let d = 20; d <= lookahead; d += 15) {
      const c = Math.abs(getCurvatureAhead(this.distance, d));
      if (c > maxCurv) maxCurv = c;
    }

    // Целевая скорость зависит от кривизны
    // maxCurv ~ 0 (прямая) -> 340 км/ч, maxCurv ~ 0.5 (крутой поворот) -> 80 км/ч
    const targetSpeed = Math.max(70, CONFIG.MAX_SPEED * (1 - maxCurv * 1.6));

    const speedDiff = targetSpeed - this.speed;

    if (speedDiff > 5) {
      // Разгон
      this.throttle = Math.min(100, 40 + speedDiff * 2);
      this.brake = 0;
    } else if (speedDiff < -15) {
      // Торможение
      this.brake = Math.min(100, -speedDiff * 3);
      this.throttle = 0;
    } else {
      // Поддержание
      this.throttle = 30 + speedDiff * 1.5;
      this.brake = 0;
    }

    // Steering — насколько сильно руль отклонён относительно направления
    const pose = getTrackPose(this.distance);
    const angleToTrack = getCurvatureAhead(this.distance, 10) * 30;
    this.steering = Math.max(-100, Math.min(100, angleToTrack * 100));

    // DRS на прямых
    this.drs = maxCurv < 0.05 && this.speed > 250;
  }

  /* Реальная физика: разгон до 340 за ~10 секунд */
  _physics(dt) {
    // Сила от газа (m/s²)
    const throttleAccel = this.throttle * 0.09;  // макс 9 м/с²

    // Торможение (m/s²)
    const brakeDecel = this.brake * 0.12;         // макс 12 м/с²

    // Аэродинамическое сопротивление + качение
    const speedMs = this.speed / 3.6;
    const drag = 0.0009 * speedMs * speedMs + 0.05;  // квадратичное + трение

    // ERS boost (если есть заряд)
    const ersBoost = (this.ers > 5 && this.throttle > 70) ? 0.03 : 0;

    // Ускорение (км/ч за секунду)
    const accelMs2 = throttleAccel + ersBoost * 100 - brakeDecel - drag;

    this.speed += accelMs2 * 3.6 * dt;
    this.speed = Math.max(0, Math.min(CONFIG.MAX_SPEED, this.speed));
  }

  _shiftGears() {
    const s = this.speed;
    if (s < 5) this.gear = 0;
    else if (s < 45) this.gear = 1;
    else if (s < 80) this.gear = 2;
    else if (s < 120) this.gear = 3;
    else if (s < 160) this.gear = 4;
    else if (s < 200) this.gear = 5;
    else if (s < 240) this.gear = 6;
    else if (s < 280) this.gear = 7;
    else this.gear = 8;
  }

  _rpmCalc() {
    const ratio = CONFIG.GEAR_RATIOS[this.gear];
    if (ratio > 0 && this.gear > 0) {
      // Диапазон RPM для передачи: низ передачи = низкий RPM, верх = красная зона
      const gearMinSpeed = [0, 0, 45, 80, 120, 160, 200, 240, 280][this.gear] || 0;
      const gearMaxSpeed = [0, 45, 80, 120, 160, 200, 240, 280, 340][this.gear] || 340;
      const frac = Math.max(0, Math.min(1, (this.speed - gearMinSpeed) / (gearMaxSpeed - gearMinSpeed)));
      this.rpm = 5000 + frac * 10000;  // 5000 - 15000
    } else {
      this.rpm = 3000 + this.throttle * 30;
    }
  }

  _ers(dt) {
    if (this.throttle > 70) {
      this.ers = Math.max(0, this.ers - 1.5 * dt);
    } else if (this.brake > 20) {
      this.ers = Math.min(100, this.ers + 2.5 * dt);
    }
  }

  _fuel(dt) {
    this.fuel = Math.max(0, this.fuel - 0.08 * dt * (0.5 + this.throttle / 100));
  }

  _tires(dt) {
    for (let i = 0; i < 4; i++) {
      const target = 85 + this.speed * 0.04 + this.brake * 0.15;
      this.tireTemp[i] += (target - this.tireTemp[i]) * 0.5 * dt;
      this.tireWear[i] = Math.min(100, this.tireWear[i] + 0.03 * dt);
    }
  }

  _move(dt) {
    const speedMs = this.speed / 3.6;
    this.distance += speedMs * dt;

    const pose = getTrackPose(this.distance);
    this.position = [pose.x, pose.y, pose.angle];

    // Проверка круга
    const totalLaps = Math.floor(this.distance / TRACK_LENGTH);
    if (totalLaps > this.lap && this.lapTime > 10) {
      if (this.bestLap === null || this.lapTime < this.bestLap) {
        this.bestLap = this.lapTime;
      }
      this.lap = totalLaps;
      this.lapStart = performance.now() / 1000;
    }
  }

  getData() {
    return {
      speed: this.speed,
      rpm: this.rpm,
      gear: this.gear,
      throttle: this.throttle,
      brake: this.brake,
      steering: this.steering,
      drs: this.drs,
      ers: this.ers,
      fuel: this.fuel,
      tireTemp: [...this.tireTemp],
      tireWear: [...this.tireWear],
      position: [...this.position],
      lap: this.lap,
      lapTime: this.lapTime,
      bestLap: this.bestLap
    };
  }
}

/* ============================================================
   UI
   ============================================================ */
const UI = {
  el(id) { return document.getElementById(id); },

  update(data) {
    this.el('speed').textContent = data.speed.toFixed(0);
    this.el('speedBar').style.width = (data.speed / CONFIG.MAX_SPEED * 100) + '%';
    this.el('rpm').textContent = data.rpm.toFixed(0);
    this.el('rpmBar').style.width = (data.rpm / CONFIG.MAX_RPM * 100) + '%';
    this.el('gear').textContent = data.gear > 0 ? data.gear : 'N';

    this.el('drsBadge').classList.toggle('active', data.drs);

    const thrBar = this.el('throttleBar');
    thrBar.style.width = data.throttle + '%';
    thrBar.textContent = data.throttle.toFixed(0) + '%';

    const brkBar = this.el('brakeBar');
    brkBar.style.width = data.brake + '%';
    brkBar.textContent = data.brake.toFixed(0) + '%';

    const s = Math.max(-100, Math.min(100, data.steering));
    const sBar = this.el('steeringBar');
    // Ширина относительно центра: макс отклонение = 40% от центра
    sBar.style.left = (50 + s * 0.4) + '%';
    sBar.style.width = Math.abs(s * 0.8) + 'px';
    this.el('steeringValue').textContent = s.toFixed(0) + '°';

    this.el('lapCount').textContent = data.lap;
    this.el('currentLap').textContent = this.formatTime(data.lapTime);
    this.el('bestLap').textContent = data.bestLap ? this.formatTime(data.bestLap) : '--.---';

    this.el('ersBar').style.width = data.ers + '%';
    this.el('fuelBar').style.width = data.fuel + '%';

    const labels = ['FL', 'FR', 'RL', 'RR'];
    for (let i = 0; i < 4; i++) {
      const t = data.tireTemp[i];
      this.el('temp' + labels[i]).textContent = t.toFixed(0) + '°';
      this.el('wear' + labels[i]).style.width = data.tireWear[i] + '%';

      const card = this.el('tire' + labels[i]);
      let color = '#E10600';
      if (t >= 80 && t <= 110) color = '#00D2BE';
      else if (t < 80) color = '#FFD700';
      card.style.borderTopColor = color;
    }
  },

  formatTime(t) {
    if (t < 60) return t.toFixed(3);
    const m = Math.floor(t / 60);
    const s = t - m * 60;
    return m + ':' + s.toFixed(3).padStart(6, '0');
  }
};

/* ============================================================
   TRACK MAP
   ============================================================ */
const TrackMap = {
  init() {
    const xs = TRACK.map(p => p[0]);
    const ys = TRACK.map(p => p[1]);

    const trackOuter = {
      x: xs, y: ys, mode: 'lines',
      line: { color: '#2A2A33', width: 22 },
      hoverinfo: 'skip', showlegend: false
    };
    const trackInner = {
      x: xs, y: ys, mode: 'lines',
      line: { color: '#4A4A55', width: 12 },
      hoverinfo: 'skip', showlegend: false
    };
    const trackCenter = {
      x: xs, y: ys, mode: 'lines',
      line: { color: '#666', width: 1, dash: 'dot' },
      hoverinfo: 'skip', showlegend: false
    };
    // Стартовая линия
    const startLine = {
      x: [TRACK[0][0] - 10, TRACK[0][0] + 10],
      y: [TRACK[0][1], TRACK[0][1]],
      mode: 'lines',
      line: { color: '#FFF', width: 3 },
      hoverinfo: 'skip', showlegend: false
    };
    const carTrace = {
      x: [TRACK[0][0]], y: [TRACK[0][1]],
      mode: 'markers',
      marker: {
        size: 20, color: '#E10600', symbol: 'triangle-up',
        line: { color: '#fff', width: 2 }
      },
      hoverinfo: 'skip', showlegend: false
    };

    const layout = {
      paper_bgcolor: '#1F1F27',
      plot_bgcolor: '#1F1F27',
      margin: { l: 20, r: 20, t: 30, b: 20 },
      xaxis: { showgrid: false, zeroline: false, showticklabels: false },
      yaxis: { showgrid: false, zeroline: false, showticklabels: false,
               scaleanchor: 'x', scaleratio: 1 },
      title: { text: 'TRACK MAP', font: { color: '#888', size: 12 }, x: 0.02 },
      showlegend: false
    };

    Plotly.newPlot('trackMap', [trackOuter, trackInner, trackCenter, startLine, carTrace], layout, {
      displayModeBar: false, responsive: true
    });
  },

  update(position) {
    const angleDeg = position[2] * 180 / Math.PI;
    // Plotly marker angle: 0° = вверх, против часовой; triangle-up уже смотрит вверх
    // Мы хотим, чтобы нос смотрел по направлению движения
    const markerAngle = angleDeg - 90;
    Plotly.restyle('trackMap', {
      x: [[position[0]]],
      y: [[position[1]]],
      'marker.angle': [markerAngle]
    }, [4]);
  }
};

/* ============================================================
   HISTORY CHART
   ============================================================ */
const HistoryChart = {
  times: [], speeds: [], throttles: [], brakes: [],
  t0: null, plotDiv: null, layout: null,

  init() {
    const layout = {
      paper_bgcolor: '#1F1F27',
      plot_bgcolor: '#1F1F27',
      font: { color: '#ccc' },
      margin: { l: 55, r: 55, t: 35, b: 35 },
      xaxis: {
        title: 'Time (s)', color: '#888',
        gridcolor: '#2A2A33',
        range: [0, 30]
      },
      yaxis: {
        title: 'Speed (km/h)', color: '#E10600',
        gridcolor: '#2A2A33',
        range: [0, CONFIG.MAX_SPEED + 20]
      },
      yaxis2: {
        title: 'Inputs %', overlaying: 'y', side: 'right',
        color: '#00D2BE', range: [0, 100]
      },
      legend: {
        orientation: 'h', y: 1.12, x: 0,
        font: { size: 11, color: '#ccc' }
      }
    };
    this.layout = layout;

    const data = [
      { x: [], y: [], type: 'scatter', mode: 'lines',
        name: 'Speed (km/h)', line: { color: '#E10600', width: 2 } },
      { x: [], y: [], type: 'scatter', mode: 'lines',
        name: 'Throttle %', line: { color: '#00D2BE', width: 1.5 }, yaxis: 'y2' },
      { x: [], y: [], type: 'scatter', mode: 'lines',
        name: 'Brake %', line: { color: '#FFD700', width: 1.5 }, yaxis: 'y2' }
    ];

    Plotly.newPlot('historyChart', data, layout, {
      displayModeBar: false, responsive: true
    });
  },

  push(data) {
    const now = performance.now() / 1000;
    if (this.t0 === null) this.t0 = now;
    const t = now - this.t0;

    this.times.push(t);
    this.speeds.push(data.speed);
    this.throttles.push(data.throttle);
    this.brakes.push(data.brake);

    while (this.times.length > CONFIG.HISTORY_SIZE) {
      this.times.shift();
      this.speeds.shift();
      this.throttles.shift();
      this.brakes.shift();
    }

    // Скользящее окно по X
    const xMin = Math.max(0, t - 30);
    const xMax = Math.max(30, t);
    this.layout.xaxis.range = [xMin, xMax];

    Plotly.react('historyChart', [
      { x: this.times, y: this.speeds, type: 'scatter', mode: 'lines',
        name: 'Speed (km/h)', line: { color: '#E10600', width: 2 } },
      { x: this.times, y: this.throttles, type: 'scatter', mode: 'lines',
        name: 'Throttle %', line: { color: '#00D2BE', width: 1.5 }, yaxis: 'y2' },
      { x: this.times, y: this.brakes, type: 'scatter', mode: 'lines',
        name: 'Brake %', line: { color: '#FFD700', width: 1.5 }, yaxis: 'y2' }
    ], this.layout, { displayModeBar: false, responsive: true });
  },

  reset() {
    this.times = []; this.speeds = [];
    this.throttles = []; this.brakes = [];
    this.t0 = null;
  }
};

/* ============================================================
   MAIN LOOP
   ============================================================ */
const car = new CarSimulator();
let paused = false;
let lastTime = performance.now();
let lastUIUpdate = 0;
let lastChartUpdate = 0;

function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  if (!paused) {
    car.update(dt);
    const data = car.getData();

    // UI обновляем ~20 раз/сек
    if (now - lastUIUpdate > 50) {
      UI.update(data);
      TrackMap.update(data.position);
      lastUIUpdate = now;
    }

    // График ~10 раз/сек
    if (now - lastChartUpdate > 100) {
      HistoryChart.push(data);
      lastChartUpdate = now;
    }
  }

  requestAnimationFrame(loop);
}

window.addEventListener('load', () => {
  TrackMap.init();
  HistoryChart.init();

  document.getElementById('pauseBtn').addEventListener('click', (e) => {
    paused = !paused;
    e.target.textContent = paused ? '▶ RESUME' : '⏸ PAUSE';
    e.target.classList.toggle('paused', paused);
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    car.reset();
    HistoryChart.reset();
    lastTime = performance.now();
  });

  requestAnimationFrame(loop);
});
</script>
